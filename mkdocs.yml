site_name: Haohu 的个人网站
site_description: 记录编程、学习与生活的笔记
site_url: https://hhhydrogen.github.io/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

nav:
  - 主页: index.md
  - 关于我: about.md
  - 文章归档: archive.md

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
